<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App UI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 700px; width: 100%; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; text-align: center; color: #38bdf8; }
    p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
    .card { background-color: #1e293b; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.4rem; }
    input[type="text"], textarea { width: 100%; padding: 0.75rem; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus, textarea:focus { border-color: #38bdf8; }
    button { background-color: #0284c7; color: white; border: none; padding: 0.75rem 1.5rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; width: 100%; }
    button:hover { background-color: #0369a1; }
    .notes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .notes-list { display: flex; flex-direction: column; gap: 1rem; }
    .note-item { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 1.25rem; position: relative; }
    .note-title { font-size: 1.15rem; font-weight: 700; color: #f8fafc; margin-bottom: 0.5rem; }
    .note-content { color: #cbd5e1; font-size: 0.95rem; white-space: pre-wrap; margin-bottom: 0.75rem; }
    .note-date { font-size: 0.75rem; color: #64748b; }
    .delete-btn { position: absolute; top: 1rem; right: 1rem; background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 0.25rem 0.6rem; font-size: 0.75rem; border-radius: 6px; width: auto; }
    .delete-btn:hover { background-color: #ef4444; color: white; }
    .empty-state { text-align: center; color: #64748b; padding: 2rem; font-style: italic; }
    .api-badge { display: inline-block; background-color: #0369a1; color: #e0f2fe; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Notes App API UI</h1>
    <p class="subtitle">Connected to Backend API endpoint: <span class="api-badge">GET /api/notes</span></p>

    <div class="card">
      <h2 style="font-size: 1.1rem; margin-bottom: 1rem; color: #f8fafc;">Add a New Note</h2>
      <form id="noteForm">
        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" placeholder="e.g. Full Stack Development Assignment" required />
        </div>
        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" rows="3" placeholder="e.g. Build Express REST API with JSON file persistence."></textarea>
        </div>
        <button type="submit">Save Note</button>
      </form>
    </div>

    <div class="notes-header">
      <h2 style="font-size: 1.1rem;">Saved Notes</h2>
    </div>

    <div id="notesContainer" class="notes-list">
      <div class="empty-state">Loading notes...</div>
    </div>
  </div>

  <script>
    const API_URL = '/api/notes';

    async function fetchNotes() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        renderNotes(data.notes || []);
      } catch (err) {
        console.error(err);
        document.getElementById('notesContainer').innerHTML = '<div class="empty-state" style="color:#ef4444">Failed to load notes from API</div>';
      }
    }

    function renderNotes(notes) {
      const container = document.getElementById('notesContainer');
      if (notes.length === 0) {
        container.innerHTML = '<div class="empty-state">No notes found. Create your first note above!</div>';
        return;
      }

      container.innerHTML = notes.map(note => `
        <div class="note-item">
          <div class="note-title">${escapeHtml(note.title)}</div>
          <div class="note-content">${escapeHtml(note.content || '')}</div>
          <div class="note-date">Created: ${new Date(note.createdAt).toLocaleString()}</div>
          <button class="delete-btn" onclick="deleteNote('${note.id}')">Delete</button>
        </div>
      `).join('');
    }

    document.getElementById('noteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });
        if (res.ok) {
          document.getElementById('title').value = '';
          document.getElementById('content').value = '';
          fetchNotes();
        } else {
          const err = await res.json();
          alert('Error: ' + err.error);
        }
      } catch (err) {
        alert('Failed to save note.');
      }
    });

    async function deleteNote(id) {
      if (!confirm('Are you sure you want to delete this note?')) return;
      try {
        const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        if (res.ok) {
          fetchNotes();
        }
      } catch (err) {
        alert('Failed to delete note.');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    fetchNotes();
  </script>
</body>
</html>
